[project]
name = "api"
version = "1.0.0"
description = "What I Saw When I Was a Kid — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-speech>=2.30.0",
    "google-cloud-translate>=3.18.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.25.0",
    "google-cloud-logging>=3.11.0",
    "google-genai>=1.0.0",
    "google-adk>=0.1.0",
    "firebase-admin>=6.6.0",
    "python-multipart>=0.0.19",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# PEP 735 development group. Unlike `optional-dependencies`, uv installs this
# one by default, which is what makes the documented `uv run pytest tests/ -v`
# work without an extra `--extra dev` or `--group dev` flag.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable package is `app/`, not `api/`, so hatchling cannot infer the
# wheel contents from the project name. Without this, `uv run` / `uv sync`
# fail with "Unable to determine which files to ship inside the wheel".
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
