<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B8DB8" />
      <stop offset="35%" stop-color="#8DB4D6" />
      <stop offset="65%" stop-color="#E3AF6C" />
      <stop offset="85%" stop-color="#E8B93C" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#F6F3EC" />
    </linearGradient>
    <radialGradient id="sun" cx="65%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FFF6DF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#E8B93C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E8B93C" stop-opacity="0" />
    </radialGradient>
    <filter id="paint-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)" />
  <circle cx="1250" cy="480" r="350" fill="url(#sun)" />
  
  <!-- Painterly cloud brush strokes -->
  <g opacity="0.45" filter="url(#paint-texture)">
    <ellipse cx="600" cy="350" rx="450" ry="80" fill="#F6F3EC" />
    <ellipse cx="1100" cy="280" rx="500" ry="70" fill="#FFF1D0" />
    <ellipse cx="850" cy="420" rx="380" ry="60" fill="#E5A96A" />
  </g>
  
  <!-- Horizon silhouette suggestion of rustic street corner -->
  <path d="M0,860 Q480,840 960,860 T1920,850 L1920,1080 L0,1080 Z" fill="#221E19" opacity="0.12" />
  <path d="M0,910 Q500,890 1000,910 T1920,900 L1920,1080 L0,1080 Z" fill="#1B1713" opacity="0.15" />
</svg>